[project]
name = "friday-tony-stark-demo"
version = "0.1.0"
description = "Friday — A Tony Stark-inspired MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic",
    "fastapi",
    "fastmcp",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "google-genai",
    "httpx",
    "livekit-agents[deepgram,groq,openai,sarvam,silero]>=1.5.1",
    "livekit-plugins-google>=1.5.1",
    "mediapipe",
    "numpy",
    "opencv-python",
    "playwright",
    "pydantic>=2.7",
    "pyautogui>=0.9.54",
    "pyside6",
    "python-dotenv",
    "screen-brightness-control",
    "sqlalchemy",
    "uvicorn",
    "psycopg[binary]>=3.3.4",
]

[project.scripts]
friday = "server.server:main"
friday-api = "friday.src.main:main"
friday_api = "friday.src.main:main"
friday_voice = "server.agent_friday:dev" # Points to the wrapper

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["friday", "server"]
