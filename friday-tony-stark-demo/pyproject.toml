[project]
name = "friday-tony-stark-demo"
version = "0.1.0"
description = "Friday — A Tony Stark-inspired MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic",
    "fastapi",
    "fastmcp",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "google-genai",
    "httpx",
    "livekit-agents[deepgram,groq,openai,sarvam,silero]>=1.5.1",
    "livekit-plugins-google>=1.5.1",
    "mediapipe",
    "numpy",
    "opencv-python",
    "playwright",
    "pydantic>=2.7",
    "pyautogui>=0.9.54",
    "pyside6",
    "python-dotenv",
    "screen-brightness-control",
    "sqlalchemy",
    "trackers>=2.6,<3",
    "uvicorn",
    "psycopg[binary]>=3.3.4",
    "onnxruntime-gpu[cuda,cudnn]>=1.24.4,<1.27; sys_platform == 'win32'",
    "onnxruntime>=1.24.4; sys_platform != 'win32'",
]

[project.optional-dependencies]
vision-grounding = [
    "pillow>=10,<13",
    "torch>=2.6,<3",
    "transformers>=4.57,<6",
]
vision-benchmark = [
    "rfdetr>=1,<2",
]

[project.scripts]
friday = "server.server:main"
friday-api = "friday.src.main:main"
friday_api = "friday.src.main:main"
friday_voice = "server.agent_friday:dev" # Points to the wrapper
friday-vision-annotate = "friday.app.perception.annotation.cli:main"
friday-detector-benchmark = "friday.app.perception.evaluation.cli:main"
friday-vision-license-audit = "friday.app.perception.licensing.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["friday", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
