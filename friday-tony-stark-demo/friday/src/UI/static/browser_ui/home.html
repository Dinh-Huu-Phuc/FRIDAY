<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FRIDAY</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #eafafa;
      background: #03070a;
    }

    main {
      display: grid;
      justify-items: center;
      gap: 18px;
    }

    img {
      width: 112px;
      height: 112px;
      object-fit: cover;
      border: 1px solid #36747b;
      border-radius: 50%;
      box-shadow: 0 0 30px rgb(79 238 230 / 20%);
    }

    h1 {
      margin: 0;
      color: #f4ffff;
      font-size: 46px;
      font-weight: 600;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: #69e6de;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0;
    }
  </style>
</head>
<body>
  <main>
    <img src="../../../../assets/img/Friday.jpg" alt="">
    <h1>FRIDAY</h1>
    <p>SECURE BROWSER</p>
  </main>
</body>
</html>
